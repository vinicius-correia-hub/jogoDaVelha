<!DOCTYPE html>
<html lang="en">
<head>
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <table class="info">
        <tr>
            <td class="info"><h1 id="jogador1">Jogador 1</h1></td>
            <td class="info"><img src="imagens/circulo.png" alt="circulo"></td>
        </tr>
        <tr>
            <td class="info"><h1 id="jogador2">Jogador 2</h1></td>
            <td class="info"><img src="imagens/x.png" alt="x"></td>
        </tr> 
    </table>
    
    <table class="jogo">
        <thead>
            <tr>
                <th colspan="3" id="vez">Vez do jogador: </th>
            </tr>
        </thead>
        <tr>
            <td><img src="imagens/vazio.png" id="00" alt="imagem"></td>
            <td><img src="imagens/vazio.png" id="01" alt="imagem"></td>
            <td><img src="imagens/vazio.png" id="02" alt="imagem"></td>
        </tr>
         <tr>
            <td><img src="imagens/vazio.png" id="10" alt="imagem"></td>
            <td><img src="imagens/vazio.png" id="11" alt="imagem"></td>
            <td><img src="imagens/vazio.png" id="12" alt="imagem"></td>
        </tr>
         <tr>
            <td><img src="imagens/vazio.png" id="20" alt="imagem"></td>
            <td><img src="imagens/vazio.png" id="21" alt="imagem"></td>
            <td><img src="imagens/vazio.png" id="22" alt="imagem"></td>
        </tr>
    </table>
    <br>
    <button id="jogarNovamente">Jogar novamente</button>
    
</body>
</html>
